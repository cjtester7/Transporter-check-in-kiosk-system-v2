# Best Auctions Transporter Check-In Kiosk — Netlify configuration
# Version: 2.0.1 (2026-11-16)
# Serves index-v2.0.1.html at the site root. For each new release, upload the new
# index-vX.Y.Z.html and change the "to" path below (and this header's version).

[build]
  publish = "."

# Site root shows the current version
[[redirects]]
  from = "/"
  to = "/index-v2.0.1.html"
  status = 200
  force = true

# Old bookmarks to /index.html go to the site root
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"

# Always check for a newer page so staff get updates without clearing their cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
